<!-- Internal documentation and JavaScript section -->
<script>

// Array as mentioned in Javascript
const mybooktitles = [
    "The Lost Hero",
    "The Son Of Neptune",
    "The Mark of Athena",
    "The House of Hades",
    "The Blood of Olympus",
    "Catching Fire",
    "Mockingjay",
    "The Hunger Games",
    "To Kill a Mockingbird",
    "The Giver"
];

// Function to display books from top to bottom using innerHTML
function topToBottom() {
    document.getElementById("bookList").innerHTML = mybooktitles.join("<br>");
}

// Function to display books from bottom to top 
function bottomToTop() {
    document.getElementById("bookList").innerHTML = mybooktitles.slice().reverse().join("<br>");
}
</script>
